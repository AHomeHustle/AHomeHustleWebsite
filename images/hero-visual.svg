<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

    <linearGradient id="mainGradient" x1="100" y1="100" x2="500" y2="500">
        <stop stop-color="#6366F1"/>
        <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="cardGradient" x1="0" y1="0" x2="1" y2="1">
        <stop stop-color="white" stop-opacity="0.95"/>
        <stop offset="1" stop-color="#F8FAFC" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="blur">
        <feGaussianBlur stdDeviation="40"/>
    </filter>

    <filter id="shadow">
        <feDropShadow 
            dx="0"
            dy="20"
            stdDeviation="25"
            flood-color="#6366F1"
            flood-opacity="0.25"/>
    </filter>

</defs>


<!-- Background glow -->

<circle
    cx="420"
    cy="170"
    r="120"
    fill="#8B5CF6"
    opacity="0.25"
    filter="url(#blur)"
/>

<circle
    cx="180"
    cy="430"
    r="140"
    fill="#6366F1"
    opacity="0.2"
    filter="url(#blur)"
/>


<!-- Connection lines -->

<path
    d="M170 300 C250 220 330 220 420 300"
    stroke="url(#mainGradient)"
    stroke-width="3"
    stroke-dasharray="8 12"
    opacity="0.5"
/>


<path
    d="M220 390 C300 320 380 340 460 250"
    stroke="url(#mainGradient)"
    stroke-width="3"
    stroke-dasharray="8 12"
    opacity="0.4"
/>



<!-- Creator cards -->

<g filter="url(#shadow)">

<rect
    x="90"
    y="240"
    width="160"
    height="120"
    rx="24"
    fill="url(#cardGradient)"
/>


<circle
    cx="135"
    cy="285"
    r="22"
    fill="url(#mainGradient)"
/>


<rect
    x="175"
    y="270"
    width="50"
    height="8"
    rx="4"
    fill="#111827"
    opacity="0.8"
/>


<rect
    x="175"
    y="290"
    width="35"
    height="6"
    rx="3"
    fill="#6B7280"
/>


<rect
    x="120"
    y="330"
    width="100"
    height="8"
    rx="4"
    fill="#E5E7EB"
/>

</g>



<!-- Central growth card -->

<g filter="url(#shadow)">

<rect
    x="190"
    y="170"
    width="220"
    height="170"
    rx="30"
    fill="white"
/>


<path
    d="M230 310 C270 270 320 290 370 230"
    stroke="url(#mainGradient)"
    stroke-width="6"
    fill="none"
    stroke-linecap="round"
/>


<circle
    cx="370"
    cy="230"
    r="10"
    fill="#8B5CF6"
/>

</g>



<!-- Floating creator nodes -->

<circle
    cx="450"
    cy="180"
    r="35"
    fill="url(#mainGradient)"
    opacity="0.9"
/>


<circle
    cx="470"
    cy="410"
    r="45"
    fill="#6366F1"
    opacity="0.15"
/>


<rect
    x="330"
    y="390"
    width="140"
    height="70"
    rx="20"
    fill="white"
    filter="url(#shadow)"
/>


<!-- Creator avatars -->

<circle
    cx="375"
    cy="420"
    r="12"
    fill="url(#mainGradient)"
/>

<path
    d="M355 450
       C355 432 395 432 395 450
       Z"
    fill="url(#mainGradient)"
/>


<circle
    cx="425"
    cy="420"
    r="12"
    fill="#8B5CF6"
/>

<path
    d="M405 450
       C405 432 445 432 445 450
       Z"
    fill="#8B5CF6"
/>
</text>


</svg>
